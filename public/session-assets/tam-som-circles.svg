<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="'DM Sans', system-ui, sans-serif">
  <rect width="760" height="520" fill="#fafafa"/>
  <!-- nested circles -->
  <circle cx="300" cy="270" r="210" fill="#e6edf3" stroke="#1a3a5c" stroke-width="2"/>
  <circle cx="300" cy="330" r="140" fill="#c7d7e5" stroke="#1a3a5c" stroke-width="2"/>
  <circle cx="300" cy="390" r="72" fill="#1a3a5c" stroke="#12283f" stroke-width="2"/>
  <!-- circle labels -->
  <text x="300" y="105" text-anchor="middle" font-size="22" font-weight="700" fill="#1a3a5c">TAM</text>
  <text x="300" y="128" text-anchor="middle" font-size="13" fill="#334155">everyone who could use it</text>
  <text x="300" y="238" text-anchor="middle" font-size="20" font-weight="700" fill="#12283f">SAM</text>
  <text x="300" y="259" text-anchor="middle" font-size="13" fill="#1e293b">the slice you can reach</text>
  <text x="300" y="385" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">SOM</text>
  <text x="300" y="405" text-anchor="middle" font-size="12" fill="#dbe7f1">year-1 win</text>
  <!-- example callouts -->
  <g font-size="14" fill="#111111">
    <text x="530" y="150" font-weight="700" fill="#1a3a5c">Boba stand example</text>
    <line x1="510" y1="170" x2="430" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="530" y="185">TAM — drink buyers in the city</text>
    <text x="530" y="204" font-size="12" fill="#64748b">(assume: ~everyone, sometimes)</text>
    <line x1="510" y1="245" x2="418" y2="300" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="530" y="250">SAM — students within 10 min</text>
    <text x="530" y="269" font-size="12" fill="#64748b">(count: ~2,000 kids, 3 schools)</text>
    <line x1="510" y1="330" x2="372" y2="385" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="530" y="335">SOM — 200 pass daily × 1-in-4</text>
    <text x="530" y="354" font-size="12" fill="#64748b">stop × $6 avg  (now it's math)</text>
  </g>
  <!-- footer rule -->
  <text x="380" y="492" text-anchor="middle" font-size="14" font-weight="500" fill="#111111">Every circle is a count you can defend — write the assumption next to the number.</text>
</svg>
